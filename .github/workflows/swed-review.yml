# Purpose: authenticate human reviews and publish shared state through GitHub Pages.
# Input: trusted policy/data.json and issues:opened; .github/** push runs offline health checks.
# Output: authenticated review state and its data.json display projection, or push self-test health; Pages build.
# Config / Parameters: .github/swed-review-policy.json; published branch main.
# How to run: publish this file as .github/workflows/swed-review.yml.
# Does not do: no scientific QC, raw-data deletion, PAT, issue comments or HTTP server.
name: SWED shared human review

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths: ['.github/**']

concurrency:
  group: swed-human-review
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  review:
    if: github.repository == 'junxie01/swed' && github.repository_id == '1421874883'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted current main without downloading figure assets
        # Official actions/checkout v4.3.1, MIT; verified release/commit on 2026-10-17.
        # https://github.com/actions/checkout/commit/34e114876b0b11c390a56381ad16ebd13914f8d5
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /data.json
            /human_reviews.json
            /review_health.json
      - name: Validate authenticated input or run offline assertions
        id: process
        run: python3 .github/process_review_20261017.py
      - name: Commit shared reviews and their reversible display projection
        if: steps.process.outputs.state_changed == 'true' || steps.process.outputs.display_data_changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- human_reviews.json data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive authenticated SWED human reviews'
          fi
      - name: Commit only the non-scientific self-test health record
        if: steps.process.outputs.action == 'self_test'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- review_health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify SWED shared-review processor health'
          fi
      - name: Push recorded state with bounded retries against office publication
        if: steps.process.outputs.state_changed == 'true' || steps.process.outputs.display_data_changed == 'true' || steps.process.outputs.action == 'self_test'
        run: |
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            # Office preserves state/health; any unexpected rebase conflict fails
            # this job and leaves the review issue open for an idempotent retry.
            git pull --rebase origin main
            if [ "$GITHUB_EVENT_NAME" = 'issues' ]; then
              # A clean merge may retain an office graph added after this
              # review was evaluated. Re-run the same authenticated processor:
              # its issue receipt is idempotent, and its stdlib display helper
              # projects the current sources/graph/state without new science.
              python3 .github/process_review_20261017.py
              git add -- data.json
              if ! git diff --cached --quiet; then
                git commit -m 'Refresh reversible display after concurrent office publication'
              fi
            fi
          done
      - name: Explicitly request Pages publication with the built-in token
        if: steps.process.outputs.close_issue == 'true' || steps.process.outputs.action == 'self_test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh api --method POST 'repos/junxie01/swed/pages/builds'; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
      - name: Close a successfully archived review issue
        if: steps.process.outputs.close_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SWED_ISSUE_NUMBER: ${{ steps.process.outputs.issue_number }}
        run: gh api --method PATCH "repos/junxie01/swed/issues/${SWED_ISSUE_NUMBER}" -f state=closed
